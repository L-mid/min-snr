schema: study/v1
study_name: min_snr
out_dir: "runs/e12/e12b"
seed: 1077
metric: val/fid

_experiment:
  name: "e12b-playground-cosine-g5-bs64-steps625-bc64"
  notes: "E12 batch/steps sweep. Keep ~40k images total: bs=64 * 625 steps."

device: null
deterministic: true
clean_run: false

data:
  dataset: "cifar10"
  subset: null
  batch_size: 64
  num_workers: 2
  shuffle: true

model:
  name: "unet_cifar32"
  base_channels: 64

ema:
  enabled: true
  decay: 0.999

diffusion:
  enabled: true
  beta_schedule: "cosine"

optim:
  optimizer: adam
  lr: 1.0e-4

train:
  total_steps: 600
  grad_clip: 1.0
  amp: true

loss:
  weighting: "minsnr"
  minsnr_gamma: 5.0

curvature:
  enabled: false
  method: "hutchinson"
  probes: 16
  log_prefix: "curvature/hutch"

eval:
  quick: false

  recon:
    enabled: true
    every: 150
    n_batches: 4
    t_mode: "fixed"
    t_values: [0, 10, 500, 900]
    metrics: ["mse", "psnr"]
    save_images: true
    n_images: 4
    max_val: 2.0
    log_prefix: "val/recon"

  grid:
    enabled: true
    every: 150
    sampler: "ddim"
    nfe: 10
    n_samples: 18
    save_images: true

  kid:
    enabled: true
    every: 150
    n_samples: 2000
    repeats: 10
    subset_size: 100
    sampler: "ddim"
    nfe: 10
    batch_size: 64
    real_split: "train"
    real_seed: 123
    feature_cache: null

  fid_milestone:
    enabled: true
    every: 150
    run_if_kid_improved_pct: 0.0
    sampler: "ddpm"
    nfe: 20
    n_samples: 5000
    fid_stats: "stats/cifar10_inception_train.npz"

  final:
    enabled: false
    at_end: true
    sampler: "ddim"
    nfe: 10
    n_samples: 5000
    fid_stats: "stats/cifar10_inception_train.npz"

logging:
  enable: true
  backends: ["wandb"]
  log_every_n_steps: 25

  wandb:
    mode: online
    project: min_snr
    run_name: "e12b-cosine-g5-bs64-steps625-bc64"
    tags:
      - e12
      - e12b
      - playground
      - minsnr
      - gamma5
      - cosine
      - bs64
      - steps625
      - imgs40k
      - wallclock
      - recon
      - grid
      - kid
      - fid
      - bc64
    notes: "E12 sweep. Same ~40k images, fewer steps; check wallclock + quality."

  tensorboard:
    flush_secs: 10