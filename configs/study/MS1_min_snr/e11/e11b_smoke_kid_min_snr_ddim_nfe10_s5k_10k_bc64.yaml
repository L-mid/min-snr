schema: study/v1
study_name: min_snr
out_dir: "runs/"
seed: 1077
metric: val/fid

_experiment:
  name: "e11b-kid-sanity-minsnr-g5-ddim-nfe10-s5k-10k-bc64"

device: null
deterministic: true
clean_run: false

data:
  dataset: "cifar10"
  subset: null
  batch_size: 4
  num_workers: 2
  shuffle: true

model:
  name: "unet_cifar32"
  base_channels: 32

ema:
  enabled: true
  decay: 0.999

diffusion:
  enabled: true
  beta_schedule: "cosine"

optim:
  optimizer: adam
  lr: 1.0e-4

train:
  total_steps: 2
  grad_clip: 1.0
  amp: true

loss:
  weighting: "minsnr"
  minsnr_gamma: 5.0

curvature:
  enabled: true
  method: "hutchinson"
  probes: 2
  log_prefix: "curvature/hutch"

eval:
  recon:
    enabled: true
    every: 1
    n_batches: 2
    t_mode: "fixed"
    t_values: [500, 900]
    metrics: ["mse", "psnr"]
    save_images: true
    n_images: 2
    max_val: 2.0
    log_prefix: "val/recon"


  quick: false

  grid:
    enabled: true
    every: 1
    sampler: ddim
    nfe: 2
    n_samples: 2
    save_images: true

  kid:
    enabled: true
    every: 1
    n_samples: 2
    repeats: 2
    subset_size: 2
    sampler: ddim
    nfe: 2
    batch_size: 2
    real_split: "train"
    real_seed: 123
    feature_cache: null

  fid_milestone:
    enabled: true
    every: 2          # 2k,4k,6k,8k,10k
    run_if_kid_improved_pct: 0.0
    sampler: ddpm
    nfe: 2
    n_samples: 2
    fid_stats: "stats/cifar10_inception_train.npz"

  final:
    enabled: true
    at_end: true
    sampler: ddim
    nfe: 2
    n_samples: 2
    fid_stats: "stats/cifar10_inception_train.npz"

logging:
  enable: true
  backends: [wandb]
  log_every_n_steps: 1

  wandb:
    mode: online
    project: min_snr
    run_name: "e11-logging-test"
    tags: ["test"]
    notes: "e11 has been chosen to test wandb logging."

  tensorboard:
    flush_secs: 10
