schema: study/v1
study_name: min_snr
out_dir: "runs/"
seed: 1077
metric: val/fid

_experiment:
  name: "e11b-kid-sanity-minsnr-g5-ddim-nfe10-s5k-10k-bc64"

device: null
deterministic: true
clean_run: false

data:
  dataset: "cifar10"
  subset: null
  batch_size: 4
  num_workers: 2
  shuffle: true

model:
  name: "unet_cifar32"
  base_channels: 32

ema:
  enabled: true
  decay: 0.999

diffusion:
  enabled: true
  beta_schedule: "cosine"

optim:
  optimizer: adam
  lr: 1.0e-4

train:
  total_steps: 2
  grad_clip: 1.0
  amp: true

loss:
  weighting: "minsnr"
  minsnr_gamma: 5.0

curvature:
  enabled: false

eval:
  recon:
    enabled: false

  quick: false

  grid:
    enabled: true
    every: 10000
    sampler: ddim
    nfe: 10
    n_samples: 36
    save_images: true

  kid:
    enabled: true
    every: 1
    n_samples: 2
    repeats: 2
    subset_size: 100
    sampler: ddim
    nfe: 10
    batch_size: 2
    real_split: "train"
    real_seed: 123
    feature_cache: null

  fid_milestone:
    enabled: false

  final:
    enabled: true
    at_end: true
    sampler: ddim
    nfe: 10
    n_samples: 2
    fid_stats: "stats/cifar10_inception_train.npz"

logging:
  enable: true
  backends: []
  log_every_n_steps: 1

  wandb:
    mode: disabled
    project: min_snr
    run_name: "e11b-kid-sanity-minsnr-g5-ddim-nfe10-s5k-10k-bc64"
    tags: ["e11","e11b","kid","sanity","minsnr","gamma5","ddim","nfe10","s5k","10k","bc64"]
    notes: "E11 KID sanity: Min-SNR gamma=5. Compute KID(pool=5k,repeats=20) + FID(5k) at end, DDIM NFE=10."

  tensorboard:
    flush_secs: 10
