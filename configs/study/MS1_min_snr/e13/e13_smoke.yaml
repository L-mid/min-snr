schema: study/v1
study_name: min_snr
out_dir: "runs/"
seed: [1077, 11, 1]
metric: val/fid

_experiment:
  name: "e11a-kid-sanity-baseline-ddim-nfe10-s5k-10k-bc64"

device: null
deterministic: true
clean_run: false

data:
  dataset: "cifar10"
  subset: null
  batch_size: 4
  num_workers: 0
  shuffle: true

model:
  name: "unet_cifar32"
  base_channels: 32

ema:
  enabled: true
  decay: 0.999

diffusion:
  enabled: true
  beta_schedule: "linear"

optim:
  optimizer: adam
  lr: 1.0e-4

train:
  total_steps: 2
  grad_clip: 1.0
  amp: true

loss:
  weighting: "constant"

curvature:
  enabled: false
  method: "hutchinson"
  probes: 16
  log_prefix: "curvature/hutch"

eval:
  recon:
    enabled: false
    every: 2000
    n_batches: 4
    t_mode: "fixed"
    t_values: [0, 10, 50, 200, 500, 900]
    metrics: ["mse", "psnr"]
    save_images: true
    n_images: 16
    max_val: 2.0
    log_prefix: "val/recon"

  quick: true

  grid:
    enabled: false
    every: 10000
    sampler: ddim
    nfe: 10
    n_samples: 36
    save_images: true

  kid:
    enabled: false
    every: 10000
    n_samples: 5000
    repeats: 20
    subset_size: 100
    sampler: ddim
    nfe: 10
    batch_size: 64
    real_split: "train"
    real_seed: 123
    feature_cache: null

  fid_milestone:
    enabled: false
    every: 2000
    run_if_kid_improved_pct: 0.0
    sampler: ddpm
    nfe: 20
    n_samples: 5000
    fid_stats: "stats/cifar10_inception_train.npz"

  final:
    enabled: false
    at_end: true
    sampler: ddim
    nfe: 10
    n_samples: 5000
    fid_stats: "stats/cifar10_inception_train.npz"

logging:
  enable: true
  backends: []
  log_every_n_steps: 1

  wandb:
    mode: online
    project: min_snr
    run_name: "e11-logging-test"
    tags: ["test"]
    notes: "e11 has been chosen to test wandb logging."

  tensorboard:
    flush_secs: 10