schema: study/v1
study_name: min_snr
out_dir: "runs/"
seed: [1077, 11, 1]
metric: val/fid

_experiment:
  name: "e14-minsnr-linear-g5-nfe50-s5k-10k-bc64"

device: null
deterministic: true
clean_run: false

data:
  dataset: "cifar10"
  subset: null
  batch_size: 64
  num_workers: 2
  shuffle: true

model:
  name: "unet_cifar32"
  base_channels: 64

ema:
  enabled: true
  decay: 0.999

diffusion:
  enabled: true
  beta_schedule: "linear"

optim:
  optimizer: adam
  lr: 1.0e-4

train:
  total_steps: 10000
  grad_clip: 1.0
  amp: true

loss:
  weighting: "minsnr"
  minsnr_gamma: 5.0

curvature:
  enabled: false
  method: "hutchinson"
  probes: 16
  log_prefix: "curvature/hutch"

eval:
  recon:
    enabled: true
    every: 2000
    n_batches: 4
    t_mode: "fixed"
    t_values: [0, 10, 50, 200, 500, 900]
    metrics: ["mse", "psnr"]
    save_images: true
    n_images: 4
    max_val: 2.0
    log_prefix: "val/recon"

  quick: false

  grid:
    enabled: true
    every: 10000
    sampler: ddim
    nfe: 50
    n_samples: 36
    save_images: true

  kid:
    enabled: true
    every: 2500
    n_samples: 5000
    repeats: 20
    subset_size: 100
    sampler: ddim
    nfe: 50
    batch_size: 64
    real_split: "train"
    real_seed: 123
    feature_cache: null

  fid_milestone:
    enabled: true
    every: 2500
    run_if_kid_improved_pct: 0.0
    sampler: ddpm
    nfe: 50
    n_samples: 5000
    fid_stats: "stats/cifar10_inception_train.npz"

  final:
    enabled: false
    at_end: false
    sampler: ddim
    nfe: 10
    n_samples: 5000
    fid_stats: "stats/cifar10_inception_train.npz"

logging:
  enable: true
  backends: ["wandb"]
  log_every_n_steps: 500

  wandb:
    mode: online
    project: min_snr
    run_name: "e14-minsnr-linear-g5-nfe50-s5k-10k-bc64"
    tags:
      [
        "e14",
        "minsnr",
        "linear",
        "g5",
        "cifar10",
        "ema",
        "nfe50",
        "kid-ddim",
        "fid-ddpm",
        "s5k",
        "10k",
        "bc64",
        "seeds3",
      ]
    notes: "E14 Min-SNR: linear beta schedule, minsnr weighting gamma=5.0, 3 seeds. KID: DDIM NFE=50 (5k samples, repeats=20). FID milestone: DDPM NFE=50 (5k samples) every 2500 steps (includes end at 10k)."

  tensorboard:
    flush_secs: 10
